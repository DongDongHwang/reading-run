<!-- 리딩런 음성 자동 전진판 — 문단을 소리 내 읽으면 음성인식이 맞춰 보고 다음 문단으로 넘어가는 단독 HTML (클릭 백업 포함, 서버·Supabase 불필요) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리딩런 — 릴레이 낭독 챌린지</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding: 20px 16px; background: #2f7bf2; color: white; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; text-align: center; }
.wrapper { max-width: 960px; margin: auto; }
h1 { font-size: clamp(40px, 7vw, 60px); margin: 0; text-shadow: 3px 4px #1954b4; }
.english { font-size: 24px; font-weight: 900; letter-spacing: 3px; margin: 4px 0 10px; }
.subtitle { display: inline-block; padding: 9px 20px; border-radius: 30px; background: #245fc1; color: #ffeb3b; font-weight: bold; }
.dashboard { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 12px; }
#notice { background: white; color: #e85c43; padding: 10px 16px; border-radius: 12px; font-weight: bold; font-size: 18px; }
#timer { font-size: 30px; font-weight: 900; }
.track { position: relative; height: 130px; border-radius: 15px; background: #ff8055; border-top: 7px solid #4ade80; border-bottom: 7px solid #1a52b8; overflow: hidden; }
.track:before { content: ""; position: absolute; top: 50%; left: 0; right: 0; border-top: 3px dashed #ffffff99; }
.track:after { content: "🏁"; position: absolute; right: 12px; top: 36px; font-size: 40px; }
#runners { position: absolute; top: 34px; left: 10px; font-size: 42px; transition: left .6s ease; white-space: nowrap; }
.runner-icon { display: inline-block; transform: scaleX(-1); }
.running #runners { animation: bounce .4s infinite alternate; }
@keyframes bounce { to { transform: translateY(-10px); } }
#micMeter { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; font-weight: bold; font-size: 16px; }
#micMeter .meter { flex: 1; max-width: 360px; height: 14px; background: #ffffff33; border-radius: 7px; overflow: hidden; }
#micLevel { height: 100%; width: 0; background: #4ade80; transition: width .08s linear; }
#micHint { font-size: 14px; color: #fff6ad; }
.panel { margin: 16px 0; padding: 16px; background: #ffffff22; border-radius: 14px; text-align: left; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; font-size: 17px; font-weight: bold; }
select { padding: 6px 8px; font-size: 17px; border-radius: 8px; border: none; }
textarea { width: 100%; min-height: 200px; padding: 12px; font-size: 17px; line-height: 1.6; border-radius: 10px; border: none; font-family: inherit; }
.hint { font-size: 14px; color: #e6f0ff; margin: 6px 0 0; }
.controls { margin: 10px 0; }
button { border: none; border-radius: 30px; padding: 13px 22px; margin: 5px; font-size: 19px; font-weight: 900; cursor: pointer; }
button.small { font-size: 16px; padding: 9px 16px; margin: 0; background: white; color: #245fc1; }
#poemCount { font-size: 15px; color: #fff6ad; }
#start { background: #4ade80; color: #12492c; font-size: 24px; }
#next { background: #ffeb3b; color: black; }
#retry { background: #ffffffcc; color: #245fc1; }
#mic { background: #f43f5e; color: white; }
#reset { background: white; color: #333; }
#pause { background: #ffffffcc; color: #333; }
#paraInfo { font-size: 18px; font-weight: bold; margin: 10px 0; }
#text { background: white; color: #555; border-radius: 16px; padding: 26px 22px; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.9; min-height: 180px; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; }
#text .done { background: #fff200; color: black; font-weight: bold; }
#text .next { color: #2f7bf2; text-decoration: underline; text-decoration-thickness: 3px; }
#status { margin: 14px 0; font-size: 18px; color: #fff6ad; font-weight: bold; min-height: 26px; }
#result { background: white; color: #2464c8; border-radius: 16px; padding: 26px; margin: 18px 0; font-size: 24px; font-weight: bold; line-height: 1.7; }
footer { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
<div class="wrapper">
	<h1>리딩런</h1>
	<div class="english">READING RUN</div>
	<div class="subtitle">우리 반 릴레이 낭독 챌린지 🏃</div>

	<div class="dashboard">
		<div id="notice">📢 지문을 확인하고 게임을 시작해 주세요!</div>
		<div id="timer">제한시간 15:00</div>
	</div>

	<div class="track" id="track"><div id="runners"><span class="runner-icon">🏃‍♂️💨</span></div></div>

	<!-- 마이크 소리 크기 — 말할 때 막대가 움직이면 마이크는 정상이다 -->
	<div id="micMeter" hidden>
		<span>🎤 마이크</span>
		<div class="meter"><div id="micLevel"></div></div>
		<span id="micHint"></span>
	</div>

	<!-- 시작 전 설정 -->
	<div class="panel" id="settings">
		<div class="row">
			<label>참가 학생 수
				<select id="students">
					<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
					<option>6</option><option>7</option><option>8</option><option selected>9</option><option>10</option>
				</select>
			</label>
			<label>제한시간
				<select id="minutes">
					<option value="5">5분</option><option value="10">10분</option><option value="15" selected>15분</option><option value="20">20분</option><option value="30">30분</option>
				</select>
			</label>
			<label>인식 기준
				<select id="threshold">
					<option value="0.7">너그럽게 (70%)</option>
					<option value="0.8" selected>보통 (80%)</option>
					<option value="0.9">엄격하게 (90%)</option>
				</select>
			</label>
		</div>
		<div class="row">
			<button type="button" id="loadFile" class="small">📂 한글 파일(.hwpx) 불러오기</button>
			<input type="file" id="fileInput" accept=".hwpx,.txt" hidden>
			<label>읽을 시
				<select id="poemSelect"></select>
			</label>
			<span id="poemCount"></span>
		</div>
		<label for="passages"><b>📖 읽을 글</b> — <code>&lt;시 제목&gt;</code> 줄로 시를 나누고, 빈 줄로 연을 나눠요. 연 하나 = 학생 한 명 차례예요.</label>
		<textarea id="passages"></textarea>
		<p class="hint">한글 파일은 .hwpx 만 불러올 수 있어요(.hwp 는 한글에서 「다른 이름으로 저장 → HWPX」). 글은 이 컴퓨터 브라우저에만 저장되고 인터넷에 올라가지 않아요. Chrome에서 열고, 처음 시작할 때 마이크 사용을 「허용」해 주세요.</p>
	</div>

	<div class="controls">
		<button id="start">🏁 게임 시작!</button>
		<button id="next" hidden>➡️ 다음 연 (수동)</button>
		<button id="retry" hidden>↩️ 이 연 다시 읽기</button>
		<button id="mic" hidden>🎤 마이크 다시 켜기</button>
		<button id="pause" hidden>⏸ 일시정지</button>
		<button id="reset" hidden>🔄 새 게임</button>
	</div>

	<!-- 낭독 화면 -->
	<div id="reading" hidden>
		<div id="paraInfo"></div>
		<div id="text"></div>
		<div id="status" aria-live="polite"></div>
	</div>

	<div id="result" hidden></div>

	<footer>2026 제10회 연가 책잔치<br>꿈마루 도서실 · 연수실</footer>
</div>

<script>window.READING_RUN_POEMS = "\u003c퐁당퐁당>\n퐁당퐁당 돌을 던지자.\n누나 몰래 돌을 던지자.\n냇물아 퍼져라, 널리 멀리 퍼져라.\n건너편에 앉아서 나물을 씻는\n우리 누나 손등을 간질여 주어라.\n\n퐁당퐁당 돌을 던지자.\n누나 몰래 돌을 던지자.\n냇물아 퍼져라, 퍼질 대로 퍼져라.\n고운 노래 한마디 들려 달라고\n우리 누나 손등을 간질여 주어라.\n\n\u003c누가누가 잠자나>\n넓고 넓은 밤하늘엔\n누가누가 잠자나.\n하늘나라 아기별이\n깜박깜박 잠자지.\n\n깊고 깊은 숲 속에선\n누가누가 잠자나.\n산새 들새 모여앉아\n꼬박꼬박 잠자지.\n\n포근포근 엄마 품엔\n누가누가 잠자나.\n우리 아기 예쁜 아기\n새근새근 잠자지.\n\n\u003c밤이슬>\n풀잎 위에\n작은 달이 하나 떴습니다.\n\n앨두알처럼 작고 귀여운\n달이 하나\n떴습니다.\n\n풀벌레들이\n어두워할까 봐\n\n풀잎 위에\n빨간 달이 하나\n몰래 몰래 떴습니다.\n\n\u003c눈 내리는 날>\n숲길에 나가 보니\n수북수북 눈이 쌓여\n나뭇가지들이 활처럼 휘었다.\n\n매서운\n겨울바람과 싸우려면\n나무들은 한번쯤\n휠 줄 알아야지.\n\n한발 물러설 줄 알고\n굽힐 줄도 알고\n때론 져 줄 줄도 알아야지.\n\n겨울 눈에겐 그런 생각이 있었다.\n나뭇가지들을\n활처럼 휘어 놓은 데는.\n\n\u003c봄 하늘>\n이슬비가 온다.\n머리카락에 내려앉아도\n도무지 무게를 모를 이슬비가.\n\n하늘은\n이렇게 가벼운 이슬비도\n모두 내려놓는다.\n\n집으로 돌아올 때에 보니\n비 내리던 하늘이\n그림 속 물감처럼 파래졌다.\n\n저렇게 하늘이 파래지려고\n봄 하늘은\n이슬비마저 촘촘촘 내려놓았다.\n\n\u003c달님, 부탁이어요>\n달님, 부탁이어요.\n지금 누가\n날 생각하고 있는지\n한번 쓰윽 내려다봐 주실래요?\n\n누가 나처럼\n창가에 서서\n내 생각을 하고 있는지를요.\n\n그 사람은 어떻게 생겼나요?\n그도 보랏빛 들꽃을 좋아하고\n별이며 고양이를 좋아하나요?\n\n달님, 잠깐 내려다보고\n내게 말 좀 해 주실래요?\n\n\u003c바스락>\n가랑잎 더미에서\n바스락,\n바스락대는 소리가 난다.\n\n나무 뒤에 숨어\n가만히 엿본다.\n바스락, 가랑잎이 꿈을 꾸는 건지\n또 바스락댄다.\n\n살금살금 다가가\n가랑잎 더미를 헤친다.\n\n아, 금빛 민들레.\n\n민들레가\n어두운 가랑잎 더미 안에서\n봄을 만들고 있다.\n바스락!\n\n\u003c달개비는 파랗지>\n달개비는\n꺾어 오기 전에도\n밭두렁 머리에서\n파랗게 꽃 피었는데\n\n내 책상 위\n꽃병 안에 와서도\n지금 파아래.\n\n자리를 옮겼다고\n달라지지 않지.\n어디에 가 살아도 달개비는\n\n무명실처럼\n하얀 뿌리를 내리고\n제가 살던 식대로\n그대로 살지, 파아랗게.\n\n\u003c둥근 세상>\n사과가 둥글다.\n복숭아며 자두가 둥글다.\n분꽃에서 따 낸 분꽃씨가 둥글다.\n\n이걸 보면 알지.\n이들과 함께 살아온 지구가\n둥글다는 걸.\n\n암탉이\n낳아 놓은 달걀을 봐 봐.\n빗방울이 통통통 그리는\n동그라미들을 봐 봐.\n\n이걸 보면 알잖아.\n세상을 만든 이의 마음 또한\n둥글다는 걸.\n\n\u003c나무는 기다렸지요>\n먼 들판을 날아온\n새들이 지친 몸으로\n나뭇가지를 딛고 앉습니다.\n\n나무는\n누군가 자신을 딛고 앉기를\n기다렸지요.\n\n하룻밤을 쉬고 난 새들이\n나뭇가지를 딛고\n훌쩍, 하늘로 날아오릅니다.\n\n누군가\n자신을 딛고 높이 오르기를\n나무는 기다렸지요.\n\n\u003c이사>\n달팽이가 이사 간다\n집 한 채 지고 간다\n한 고개 넘었다 두 고개 넘었다\n어, 다 못 가 해가 꼬박 졌다\n\n달팽아 달팽아\n해가 꼬박 져도 가거라\n어두우면 손전등 켜고 가거라\n호랑이가 나와도 가거라\n배고파도 가거라\n\n달팽이가 달팽이가 이사 간다\n아파트 단지에서는 살기 힘들다고\n산골로 산골로 이사 간다\n\n\u003c여우구름>\n복슬복슬 새하얀 털에\n꼬리 아홉 개 달린\n천 // 한글 파일 원본의 오타 교정 (2026-10-19 동동이 확인) — 내장 데이터·불러온 파일 모두 화면에 넣기 전에 적용한다
const CORRECTIONS = [
	["앨두알처럼 작고 귀여운", "앵두알처럼 작고 귀여운"],   // 밤이슬 — 없는 말 「앨두알」
	["\n그 애 연습장\n", "\n그애 연습장\n"]               // 그애 연습장 — 제목·2행과 띄어쓰기 통일
];
function applyCorrections(text) {
	return CORRECTIONS.reduce((t, [from, to]) => t.split(from).join(to), String(text || ""));
}
const DEFAULT_TEXT = typeof window.READING_RUN_POEMS === "string" && window.READING_RUN_POEMS.trim()
	? applyCorrections(window.READING_RUN_POEMS)
	: PRACTICE_TEXT;
const TITLE_LINE = /^[<〈《](.+)[>〉》]$/;

const state = {
	paragraphs: [], index: 0, student: 1, students: 9, turn: 0,
	secondsLeft: 900, timer: null,
	playing: false, paused: false, totalSeconds: 900, threshold: 0.8,
	totalChars: 0, autoCount: 0, manualCount: 0,
	confirmed: "", interim: "", matched: 0, hits: 0, soundPos: 0, settleTimer: null,
	recognition: null, generation: 0, micBlocked: false, micTrack: null, micRequest: null,
	usesTrack: false, reconnectTimer: null, netDown: false,
	resultsLen: 0, transition: false, lastResultAt: 0, hintShown: false
};

function normalize(text) {
	return String(text || "").replace(/[^가-힣a-zA-Z0-9]/g, "").toLowerCase();
}

function loadText() {
	try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
}

function saveText(text) {
	try { localStorage.setItem(STORAGE_KEY, text); } catch (e) { /* 저장 못 해도 게임은 진행 */ }
}

function clearSavedText() {
	try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 무시 */ }
}

// 글을 시 단위로 나눈다 — <제목> 줄이 새 시의 시작, 빈 줄이 연 구분
function parsePoems(text) {
	const poems = [];
	let current = null;
	for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
		const line = raw.trim();
		const title = line.match(TITLE_LINE);
		if (title) {
			current = { title: title[1].trim(), stanzas: [[]] };
			poems.push(current);
			continue;
		}
		if (!current) {
			current = { title: "", stanzas: [[]] };
			poems.push(current);
		}
		const last = current.stanzas[current.stanzas.length - 1];
		if (!line) {
			if (last.length) current.stanzas.push([]);
			continue;
		}
		last.push(line);
	}
	return poems
		.map(p => ({ title: p.title, stanzas: p.stanzas.map(s => s.join("\n")).filter(s => normalize(s).length > 0) }))
		.filter(p => p.stanzas.length > 0);
}

// 고른 시들을 연 단위 차례 목록으로 펼친다
function buildTurns(poems) {
	const turns = [];
	poems.forEach(poem => {
		poem.stanzas.forEach((text, i) => {
			turns.push({ title: poem.title, text, stanza: i + 1, stanzaCount: poem.stanzas.length });
		});
	});
	return turns;
}

function refreshPoemSelect() {
	const poems = parsePoems($("passages").value);
	const select = $("poemSelect");
	const previous = select.value;
	select.replaceChildren();
	const add = (value, label) => {
		const option = document.createElement("option");
		option.value = value;
		option.textContent = label;
		select.appendChild(option);
	};
	add("all", "📚 전체 — 순서대로");
	add("shuffle", "🔀 전체 — 섞어서");
	add("random", "🎲 무작위 1편");
	poems.forEach((poem, i) => add(String(i), (i + 1) + ". " + (poem.title || "제목 없음") + " (" + poem.stanzas.length + "연)"));
	if ([...select.options].some(o => o.value === previous)) select.value = previous;
	const stanzaTotal = poems.reduce((sum, p) => sum + p.stanzas.length, 0);
	$("poemCount").textContent = "시 " + poems.length + "편 · 연 " + stanzaTotal + "개";
	return poems;
}

function choosePoems(poems) {
	const choice = $("poemSelect").value;
	if (choice === "all") return poems;
	if (choice === "shuffle") {
		const a = poems.slice();
		for (let i = a.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[a[i], a[j]] = [a[j], a[i]];
		}
		return a;
	}
	if (choice === "random" || !poems[Number(choice)]) return [poems[Math.floor(Math.random() * poems.length)]];
	return [poems[Number(choice)]];
}

function currentTurn() {
	return state.paragraphs[state.index] || { title: "", text: "", stanza: 0, stanzaCount: 0 };
}

function currentParagraph() {
	return currentTurn().text;
}

// .hwpx(압축 XML)에서 본문 문단을 꺼낸다 — 빈 문단은 연 구분 빈 줄로 남긴다
async function readHwpxText(file) {
	const buf = new Uint8Array(await file.arrayBuffer());
	const view = new DataView(buf.buffer);
	let eocd = -1;
	for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
		if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
	}
	if (eocd < 0) throw new Error("hwpx 형식이 아니에요");
	const count = view.getUint16(eocd + 10, true);
	let ptr = view.getUint32(eocd + 16, true);
	const sections = [];
	for (let n = 0; n < count && view.getUint32(ptr, true) === 0x02014b50; n++) {
		const nameLen = view.getUint16(ptr + 28, true);
		const name = new TextDecoder().decode(buf.subarray(ptr + 46, ptr + 46 + nameLen));
		const match = name.match(/^Contents\/section(\d+)\.xml$/);
		if (match) {
			sections.push({ order: Number(match[1]), method: view.getUint16(ptr + 10, true), size: view.getUint32(ptr + 20, true), offset: view.getUint32(ptr + 42, true) });
		}
		ptr += 46 + nameLen + view.getUint16(ptr + 30, true) + view.getUint16(ptr + 32, true);
	}
	if (!sections.length) throw new Error("본문을 찾지 못했어요");
	sections.sort((a, b) => a.order - b.order);
	const lines = [];
	for (const s of sections) {
		const start = s.offset + 30 + view.getUint16(s.offset + 26, true) + view.getUint16(s.offset + 28, true);
		let bytes = buf.subarray(start, start + s.size);
		if (s.method === 8) {
			const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
			bytes = new Uint8Array(await new Response(stream).arrayBuffer());
		} else if (s.method !== 0) {
			throw new Error("지원하지 않는 압축 방식이에요");
		}
		const xml = new DOMParser().parseFromString(new TextDecoder().decode(bytes), "application/xml");
		for (const p of xml.documentElement.children) {
			if (p.localName !== "p") continue;
			let line = "";
			for (const run of p.children) {
				if (run.localName !== "run") continue;
				for (const t of run.children) if (t.localName === "t") line += t.textContent;
			}
			lines.push(line.trim());
		}
	}
	return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

// 소리 기준 비교 — 음성인식은 「달이→다리」「풀잎→불입」처럼 소리가 같은 다른 글자로 받아 적는다.
// 그래서 글자를 자모로 풀고, 소리 나지 않는 첫소리 ㅇ 은 빼고, 센소리·된소리·받침은 대표 소리로 묶어서 비교한다.
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = ["", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
const SOUND = { "ㄲ": "ㄱ", "ㅋ": "ㄱ", "ㄸ": "ㄷ", "ㅌ": "ㄷ", "ㅃ": "ㅂ", "ㅍ": "ㅂ", "ㅆ": "ㅅ", "ㅉ": "ㅈ", "ㅊ": "ㅈ", "ㅐ": "ㅔ", "ㅒ": "ㅖ", "ㅙ": "ㅞ", "ㅚ": "ㅞ" };
const JONG_SOUND = {
	"ㄱ": "ㄱ", "ㄲ": "ㄱ", "ㄳ": "ㄱ", "ㄺ": "ㄱ", "ㅋ": "ㄱ", "ㄴ": "ㄴ", "ㄵ": "ㄴ", "ㄶ": "ㄴ",
	"ㄷ": "ㄷ", "ㅅ": "ㄷ", "ㅆ": "ㄷ", "ㅈ": "ㄷ", "ㅊ": "ㄷ", "ㅌ": "ㄷ", "ㄹ": "ㄹ", "ㄼ": "ㄹ", "ㄽ": "ㄹ",
	"ㄾ": "ㄹ", "ㅀ": "ㄹ", "ㅁ": "ㅁ", "ㄻ": "ㅁ", "ㅂ": "ㅂ", "ㅄ": "ㅂ", "ㄿ": "ㅂ", "ㅍ": "ㅂ", "ㅇ": "ㅇ"
};

// 글 → 소리 목록. owner = 그 소리가 몇 번째 글자(normalize 기준)에서 나왔는지
function toSounds(text) {
	const sounds = [];
	const owner = [];
	Array.from(normalize(text)).forEach((ch, i) => {
		const code = ch.charCodeAt(0) - 0xAC00;
		if (code < 0 || code >= 11172) {
			sounds.push(ch);
			owner.push(i);
			return;
		}
		const cho = CHO[Math.floor(code / 588)];
		const jung = JUNG[Math.floor((code % 588) / 28)];
		const jong = JONG_SOUND[JONG[code % 28]];
		if (cho !== "ㅇ") { sounds.push(SOUND[cho] || cho); owner.push(i); }
		sounds.push(SOUND[jung] || jung);
		owner.push(i);
		if (jong) { sounds.push(jong); owner.push(i); }
	});
	return { sounds, owner };
}

// 들은 소리와 연의 소리를 순서대로 최대한 맞춘다(최장 공통 부분열).
// 앞에서부터 욕심내서 맞추면 한 번 엇나간 뒤가 줄줄이 틀리므로, 전체를 보고 가장 많이 맞는 정렬을 찾는다.
// hits = 맞은 소리 수, pos = 맞은 소리 중 연에서 가장 뒤에 있는 위치(어디까지 읽었는지)
function matchProgress(target, heard) {
	// 오래 떠든 말이 쌓여 우연히 맞는 것을 막으려고 최근에 들은 소리만 본다
	const recent = heard.slice(-Math.ceil(target.length * HEARD_WINDOW + 10));
	const n = target.length;
	const m = recent.length;
	let prev = new Array(m + 1).fill(0);
	const rowMax = [0];
	for (let i = 1; i <= n; i++) {
		const row = new Array(m + 1).fill(0);
		for (let j = 1; j <= m; j++) {
			row[j] = target[i - 1] === recent[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], row[j - 1]);
		}
		rowMax.push(row[m]);
		prev = row;
	}
	const hits = rowMax[n];
	let pos = 0;
	while (pos < n && rowMax[pos] < hits) pos++;
	return { pos, hits };
}

function setStatus(message) {
	$("status").textContent = message;
}

function formatTime(sec) {
	return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}

function renderTimer() {
	$("timer").textContent = "제한시간 " + formatTime(state.secondsLeft);
}

// 러너는 오른쪽 🏁 를 보고 달리고, 마지막 문단을 끝내면 깃발 바로 앞에 도착한다
const GOAL_SPACE = 70;
function renderRunner() {
	const ratio = state.paragraphs.length ? state.index / state.paragraphs.length : 0;
	const runners = $("runners");
	const distance = Math.max(0, $("track").clientWidth - runners.offsetWidth - GOAL_SPACE - 10);
	runners.style.left = (10 + distance * ratio) + "px";
}
window.addEventListener("resize", renderRunner);

// 읽은 글자까지 형광펜, 다음에 읽을 글자에 밑줄
function renderParagraph() {
	const box = $("text");
	box.replaceChildren();
	const fragment = document.createDocumentFragment();
	let pos = 0;
	for (const ch of Array.from(currentParagraph())) {
		const span = document.createElement("span");
		span.textContent = ch;
		if (READABLE.test(ch)) {
			if (pos < state.matched) span.className = "done";
			else if (pos === state.matched) span.className = "next";
			pos++;
		} else if (pos > 0 && pos <= state.matched) {
			span.className = "done";
		}
		fragment.appendChild(span);
	}
	box.appendChild(fragment);
}

function updateMatch() {
	const target = toSounds(currentParagraph());
	const heard = toSounds(state.confirmed + " " + state.interim).sounds;
	const total = target.sounds.length;
	const progress = matchProgress(target.sounds, heard);
	// 중간 인식 결과가 바뀌어도 형광펜이 뒤로 가지 않게 최댓값만 유지
	state.soundPos = Math.max(state.soundPos, progress.pos);
	state.hits = Math.max(state.hits, progress.hits);
	state.matched = state.soundPos > 0 ? target.owner[state.soundPos - 1] + 1 : 0;
	renderParagraph();
	const percent = Math.round(state.soundPos / total * 100);
	setStatus("🎤 듣는 중 · " + percent + "% 읽었어요");
	// 맞은 소리 비율이 기준 이상이거나, 짧은 연이라 놓친 소리가 몇 개뿐이면 정확한 것으로 본다
	const misses = total - state.hits;
	// (아주 짧은 연 — 「바스락!」 같은 한 단어 — 은 이 여유를 주지 않는다. 잡담에 섞인 소리로 넘어가는 것 방지)
	const accurate = state.hits / total >= state.threshold || (total >= 20 && misses <= SHORT_MISS_ALLOWANCE && state.hits >= total * 0.6);
	// 끝까지 왔거나(마지막 3소리 이내), 끝말이 잘못 들려도 연만큼 말했으면 다 읽은 것으로 본다
	const reachedEnd = state.soundPos >= total - 3 || heard.length >= total;
	clearTimeout(state.settleTimer);
	if (accurate && reachedEnd) {
		finishReading();
	} else if (accurate && state.soundPos >= total - END_SETTLE_SOUNDS) {
		// 음성인식이 마지막 한 단어를 못 받아 적는 경우 — 거의 끝까지 맞았고 잠깐 조용하면 다 읽은 것으로 본다
		const turn = state.turn;
		state.settleTimer = setTimeout(() => {
			if (state.playing && !state.paused && state.turn === turn) finishReading();
		}, END_SETTLE_MS);
	}
}

function finishReading() {
	const turn = state.turn;
	clearTimeout(state.settleTimer);
	state.matched = normalize(currentParagraph()).length;
	renderParagraph();
	$("notice").textContent = "👏 잘했어요! 다음 학생 준비!";
	setStatus("✅ 잘 읽었어요! 다음 연으로 넘어가요");
	// 다음 학생용 인식을 지금 바로 새로 켜 둔다 — 연이 바뀐 뒤에 켜면 켜지는 사이에 첫 단어가 사라진다.
	// (같은 인식을 계속 쓰면 Chrome 이 앞 결과를 확정하지 않아 다음 말이 사라지므로 반드시 새로 켠다 — 10-19 실측)
	state.transition = true;
	startRecognition();
	setTimeout(() => {
		// 그사이 수동 전진·다시 읽기·새 게임을 눌렀으면 넘기지 않는다
		if (state.playing && state.turn === turn) completeParagraph(false);
	}, 1200);
}

function getRecognitionClass() {
	return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function stopRecognition() {
	state.generation++;
	const old = state.recognition;
	state.recognition = null;
	if (old) {
		old.onend = null;
		try { old.abort(); } catch (e) { /* 이미 꺼진 경우 */ }
	}
}

function startRecognition() {
	const Recognition = getRecognitionClass();
	if (!Recognition) {
		setStatus("⚠️ 이 브라우저는 음성인식을 지원하지 않아요. Chrome으로 열어 주세요. (「다음 연」 버튼으로는 진행할 수 있어요)");
		return;
	}
	if (!state.playing || state.paused || state.micBlocked) return;
	stopRecognition();
	const generation = state.generation;
	const recognition = new Recognition();
	state.recognition = recognition;
	// 새 인식이 아직 아무것도 못 들었음을 표시 (startParagraph 가 그대로 쓸지 판단)
	state.resultsLen = 0;
	recognition.lang = "ko-KR";
	recognition.continuous = true;
	recognition.interimResults = true;
	recognition.maxAlternatives = 1;
	const live = () => state.recognition === recognition && state.generation === generation && state.playing;

	recognition.onstart = () => {
		if (live() && !state.netDown) setStatus("🎤 듣고 있어요! 또박또박 읽어 주세요.");
	};
	recognition.onresult = event => {
		if (!live()) return;
		state.resultsLen = event.results.length;
		state.lastResultAt = Date.now();
		if (state.netDown) {
			state.netDown = false;
			setStatus("🎤 인터넷이 다시 연결됐어요! 이어서 읽어 주세요.");
		}
		// 다음 학생으로 넘어가는 동안 들린 말은 버린다
		if (state.transition) return;
		let interim = "";
		for (let i = event.resultIndex; i < event.results.length; i++) {
			const transcript = event.results[i][0].transcript || "";
			if (event.results[i].isFinal) state.confirmed += transcript + " ";
			else interim += transcript;
		}
		state.interim = interim;
		updateMatch();
	};
	recognition.onerror = event => {
		if (!live()) return;
		if (event.error === "not-allowed" || event.error === "service-not-allowed") {
			state.micBlocked = true;
			$("mic").hidden = false;
			setStatus("⚠️ 마이크가 막혀 있어요. 주소창 왼쪽 아이콘에서 마이크를 「허용」한 뒤 「🎤 마이크 다시 켜기」를 눌러 주세요.");
		} else if (event.error === "no-speech") {
			setStatus("🎤 목소리가 아직 안 들려요. 조금 더 크게 읽어 주세요.");
		} else if (event.error === "audio-capture") {
			if (state.usesTrack) handleMicLost();
			else setStatus("⚠️ 마이크를 찾을 수 없어요. 마이크 연결을 확인해 주세요.");
		} else if (event.error === "network") {
			// 음성인식은 Google 서버를 쓰므로 인터넷이 끊기면 멈춘다 — 연결될 때까지 천천히 다시 시도한다
			state.netDown = true;
			setStatus("⚠️ 인터넷 연결이 끊겼어요 — 연결되면 자동으로 이어서 들어요. (「다음 연」 버튼은 계속 쓸 수 있어요)");
		} else if (event.error !== "aborted") {
			setStatus("⚠️ 음성인식 오류(" + event.error + ") — 자동으로 다시 켤게요.");
		}
	};
	recognition.onend = () => {
		// Chrome은 조용하거나 오래 들으면 인식을 스스로 끊는다 → 읽던 내용은 두고 다시 켠다
		if (!live() || state.micBlocked) return;
		// 마이크가 빠져서 끝난 경우엔 다시 연결하는 쪽(handleMicLost)이 인식을 켠다
		if (state.usesTrack && !(state.micTrack && state.micTrack.readyState === "live")) return;
		state.interim = "";
		// 다시 켜는 사이에 읽은 말은 들리지 않으므로 최대한 빨리 켠다 (인터넷이 끊겼으면 3초 간격으로)
		setTimeout(() => { if (live()) startRecognition(); }, state.netDown ? 3000 : 100);
	};
	try {
		// 게임 시작 때 연 마이크를 넘겨 준다 → 연이 바뀌거나 인식이 다시 켜져도 마이크 권한·알림이 다시 뜨지 않는다
		// (마이크 트랙을 못 받은 경우엔 예전처럼 브라우저가 직접 마이크를 연다)
		if (state.micTrack && state.micTrack.readyState === "live") recognition.start(state.micTrack);
		else recognition.start();
	} catch (e) {
		setStatus("⚠️ 마이크를 켜지 못했어요. 「🎤 마이크 다시 켜기」를 눌러 주세요.");
		$("mic").hidden = false;
	}
}

// 페이지를 열 때 한 번만 마이크를 열고, 페이지를 닫을 때까지 계속 쓴다 (게임을 여러 판 해도 다시 묻지 않는다)
async function ensureMicTrack() {
	if (state.micTrack && state.micTrack.readyState === "live") return state.micTrack;
	if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
	// 권한 창이 떠 있는 동안 또 부르면 같은 요청을 기다린다 (권한 창이 두 번 뜨지 않게)
	if (!state.micRequest) {
		state.micRequest = navigator.mediaDevices
			.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
			.then(stream => {
				state.micTrack = stream.getAudioTracks()[0] || null;
				if (state.micTrack) {
					state.usesTrack = true;
					// USB 마이크가 빠지는 등 마이크가 끊기면 다시 연결한다
					state.micTrack.addEventListener("ended", handleMicLost);
					attachMeter(state.micTrack);
				}
			})
			.catch(() => { state.micTrack = null; })
			.finally(() => { state.micRequest = null; });
	}
	await state.micRequest;
	return state.micTrack;
}

// 마이크 소리 크기 막대 — 같은 마이크 트랙을 들여다보기만 한다(인식에는 영향 없음)
const meter = { ctx: null, analyser: null, buf: null, track: null, running: false, loudMs: 0, last: 0 };

function attachMeter(track) {
	if (!track || meter.track === track) return;
	try {
		meter.ctx = meter.ctx || new (window.AudioContext || window.webkitAudioContext)();
		const source = meter.ctx.createMediaStreamSource(new MediaStream([track]));
		meter.analyser = meter.ctx.createAnalyser();
		meter.analyser.fftSize = 1024;
		source.connect(meter.analyser);
		meter.buf = new Float32Array(meter.analyser.fftSize);
		meter.track = track;
		$("micMeter").hidden = false;
		// 브라우저는 화면을 한 번 누르기 전엔 소리 분석을 멈춰 둔다
		$("micHint").textContent = meter.ctx.state === "running" ? "" : "화면을 한 번 누르면 막대가 움직여요";
		if (!meter.running) {
			meter.running = true;
			requestAnimationFrame(drawMeter);
		}
	} catch (e) { /* 막대 없이도 게임은 돈다 */ }
}

function drawMeter(now) {
	if (meter.analyser && meter.ctx.state === "running" && meter.track && meter.track.readyState === "live") {
		meter.analyser.getFloatTimeDomainData(meter.buf);
		let sum = 0;
		for (const v of meter.buf) sum += v * v;
		const rms = Math.sqrt(sum / meter.buf.length);
		// -60dB(조용함) ~ -10dB(큰 소리)를 0~100% 로
		const level = Math.max(0, Math.min(1, (20 * Math.log10(rms + 1e-8) + 60) / 50));
		$("micLevel").style.width = Math.round(level * 100) + "%";
		$("micLevel").style.background = level > 0.95 ? "#f43f5e" : level > 0.35 ? "#4ade80" : "#ffffff88";
		checkHeardButNotRecognized(level, now);
	}
	requestAnimationFrame(drawMeter);
}

// 소리는 계속 들어오는데 음성인식 결과가 5초 넘게 없으면 — 인터넷·인식 서버 문제일 가능성이 크다
function checkHeardButNotRecognized(level, now) {
	const dt = Math.min(200, now - (meter.last || now));
	meter.last = now;
	if (!state.playing || state.paused || state.transition || Date.now() - state.lastResultAt < 1500) {
		meter.loudMs = 0;
		return;
	}
	if (level > 0.35) meter.loudMs += dt;
	if (meter.loudMs > 5000 && !state.hintShown) {
		state.hintShown = true;
		setStatus("🎤 소리는 들리는데 글자로 안 바뀌어요 — 인터넷 연결을 확인하거나 「다음 연」으로 넘겨 주세요.");
	}
}

function resumeMeter() {
	if (meter.ctx && meter.ctx.state !== "running") {
		meter.ctx.resume().then(() => { $("micHint").textContent = ""; }).catch(() => {});
	}
}

// 마이크가 끊겼을 때 — 1초 뒤 다시 연결해 보고, 안 되면 버튼으로 안내한다
function handleMicLost() {
	if (state.micTrack && state.micTrack.readyState === "live") return;
	state.micTrack = null;
	$("micLevel").style.width = "0%";
	if (state.playing) setStatus("⚠️ 마이크 연결이 끊겼어요 — 다시 연결하는 중이에요…");
	clearTimeout(state.reconnectTimer);
	state.reconnectTimer = setTimeout(reconnectMic, 1000);
}

async function reconnectMic() {
	const track = await ensureMicTrack();
	if (track) {
		if (state.playing && !state.paused) {
			setStatus("🎤 마이크가 다시 연결됐어요! 이어서 읽어 주세요.");
			startRecognition();
		}
	} else if (state.playing) {
		$("mic").hidden = false;
		setStatus("⚠️ 마이크를 찾지 못했어요. 마이크를 연결한 뒤 「🎤 마이크 다시 켜기」를 눌러 주세요.");
	}
}

function startParagraph() {
	state.turn++;
	state.confirmed = "";
	state.interim = "";
	state.matched = 0;
	state.hits = 0;
	state.soundPos = 0;
	$("notice").textContent = "📢 " + state.student + "번 주자 낭독 차례!";
	const turn = currentTurn();
	$("paraInfo").textContent = "📖 " + (turn.title || "읽을 글") + " · " + turn.stanza + "연 / " + turn.stanzaCount + "연" +
		"   (전체 " + (state.index + 1) + " / " + state.paragraphs.length + ")";
	renderParagraph();
	renderRunner();
	state.transition = false;
	state.hintShown = false;
	meter.loudMs = 0;
	if (state.recognition && !state.paused && state.resultsLen === 0) {
		// 미리 켜 둔 인식이 아직 아무 말도 안 들었으면 그대로 쓴다 (켜지는 시간 없이 첫 단어부터 듣는다)
		if (!state.netDown) setStatus("🎤 듣고 있어요! 또박또박 읽어 주세요.");
	} else {
		// 이미 무언가 들은 인식(이전 연·잡음)이면 새로 켠다
		setStatus("🎤 마이크를 켜는 중이에요…");
		startRecognition();
	}
}

function completeParagraph(manual) {
	if (!state.playing) return;
	state.totalChars += normalize(currentParagraph()).length;
	if (manual) state.manualCount++; else state.autoCount++;
	state.index++;
	state.student = state.student % state.students + 1;
	if (state.index >= state.paragraphs.length) {
		renderRunner();
		finishGame(true);
		return;
	}
	startParagraph();
}

function finishGame(allDone) {
	state.playing = false;
	stopRecognition();
	clearInterval(state.timer);
	$("track").classList.remove("running");
	$("next").hidden = true;
	$("retry").hidden = true;
	$("mic").hidden = true;
	$("pause").hidden = true;
	state.paused = false;
	$("reading").hidden = true;
	// 일시정지한 시간은 빼고 센다
	const elapsed = state.totalSeconds - Math.max(0, state.secondsLeft);
	$("notice").textContent = allDone ? "🎉 결승선 골인!" : "⏰ 시간 종료!";
	$("result").innerHTML =
		(allDone ? "🏁 끝까지 완주했어요!" : "⏰ 제한시간이 끝났어요!") + "<br>" +
		"완주한 연 " + state.index + " / " + state.paragraphs.length + " · 걸린 시간 " + formatTime(elapsed) + "<br>" +
		"읽은 글자 " + state.totalChars + "자 → 달린 거리 " + (state.totalChars * 10) + "m<br>" +
		"<small>음성 자동 " + state.autoCount + "연 · 선생님 수동 " + state.manualCount + "연</small>";
	$("result").hidden = false;
}

async function startGame() {
	const text = $("passages").value;
	const poems = parsePoems(text);
	if (!poems.length) {
		alert("읽을 글을 먼저 넣어 주세요.");
		return;
	}
	const paragraphs = buildTurns(choosePoems(poems));
	Object.assign(state, {
		paragraphs, index: 0, student: 1,
		students: parseInt($("students").value, 10),
		secondsLeft: parseInt($("minutes").value, 10) * 60,
		threshold: parseFloat($("threshold").value),
		totalSeconds: parseInt($("minutes").value, 10) * 60,
		playing: true, paused: false, micBlocked: false, netDown: false, transition: false,
		totalChars: 0, autoCount: 0, manualCount: 0
	});
	$("settings").hidden = true;
	$("start").hidden = true;
	$("result").hidden = true;
	$("reading").hidden = false;
	$("next").hidden = false;
	$("retry").hidden = false;
	$("reset").hidden = false;
	$("mic").hidden = true;
	$("pause").hidden = false;
	$("pause").textContent = "⏸ 일시정지";
	$("track").classList.add("running");
	renderTimer();
	$("reading").hidden = true;
	$("notice").textContent = "🎤 마이크 준비 중 — 권한 창이 보이면 「허용」을 눌러 주세요";
	await ensureMicTrack();
	// 마이크 준비 중에 새 게임을 눌렀으면 시작하지 않는다
	if (!state.playing) return;
	$("reading").hidden = false;
	startTimer();
	startParagraph();
}

function startTimer() {
	clearInterval(state.timer);
	state.timer = setInterval(() => {
		state.secondsLeft--;
		renderTimer();
		if (state.secondsLeft <= 0) finishGame(false);
	}, 1000);
}

// 일시정지 — 시간과 마이크를 멈추고, 계속하면 같은 연을 처음부터 다시 듣는다
function togglePause() {
	if (!state.playing) return;
	state.paused = !state.paused;
	if (state.paused) {
		state.turn++;
		stopRecognition();
		clearInterval(state.timer);
		$("track").classList.remove("running");
		$("pause").textContent = "▶ 계속하기";
		setStatus("⏸ 일시정지 중이에요. 「▶ 계속하기」를 누르면 이어서 해요.");
	} else {
		$("track").classList.add("running");
		$("pause").textContent = "⏸ 일시정지";
		startTimer();
		startParagraph();
	}
}

function resetGame() {
	state.playing = false;
	state.turn++;
	stopRecognition();
	clearInterval(state.timer);
	$("track").classList.remove("running");
	state.paused = false;
	["next", "retry", "mic", "pause", "reset", "reading", "result"].forEach(id => { $(id).hidden = true; });
	$("settings").hidden = false;
	$("start").hidden = false;
	$("notice").textContent = "📢 지문을 확인하고 게임을 시작해 주세요!";
	state.paragraphs = [];
	state.index = 0;
	state.secondsLeft = parseInt($("minutes").value, 10) * 60;
	renderTimer();
	renderRunner();
}

$("start").addEventListener("click", startGame);
$("next").addEventListener("click", () => { if (!state.paused) completeParagraph(true); });
$("retry").addEventListener("click", () => { if (state.playing && !state.paused) startParagraph(); });
$("pause").addEventListener("click", togglePause);
$("mic").addEventListener("click", async () => {
	state.micBlocked = false;
	$("mic").hidden = true;
	await ensureMicTrack();
	startRecognition();
});
$("reset").addEventListener("click", () => {
	// 게임 중에는 실수로 눌러도 기록이 날아가지 않게 한 번 더 묻는다
	if (state.playing && !confirm("현재 게임을 종료하고 새로 시작할까요?")) return;
	resetGame();
});
$("minutes").addEventListener("change", () => {
	state.secondsLeft = parseInt($("minutes").value, 10) * 60;
	renderTimer();
});
// 프로젝터 앞에서 → 키로도 다음 문단 (글 입력 중에는 무시)
document.addEventListener("keydown", event => {
	if (event.key === "ArrowRight" && state.playing && !state.paused && document.activeElement.tagName !== "TEXTAREA") {
		completeParagraph(true);
	}
});

// 선생님이 글을 고치거나 파일을 불러왔을 때만 브라우저에 저장한다 (기본 목록 그대로면 저장 안 함)
function rememberText() {
	const text = $("passages").value;
	if (text.trim() === DEFAULT_TEXT.trim()) clearSavedText();
	else saveText(text);
	refreshPoemSelect();
}
$("passages").addEventListener("input", rememberText);
$("loadFile").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async () => {
	const file = $("fileInput").files[0];
	$("fileInput").value = "";
	if (!file) return;
	try {
		const text = applyCorrections(/\.hwpx$/i.test(file.name) ? await readHwpxText(file) : await file.text());
		if (!parsePoems(text).length) throw new Error("읽을 글이 없어요");
		$("passages").value = text;
		rememberText();
		const poems = parsePoems(text);
		alert("불러왔어요! 시 " + poems.length + "편을 찾았어요.");
	} catch (e) {
		alert("파일을 읽지 못했어요 — " + e.message + "\n.hwp 파일이면 한글에서 「다른 이름으로 저장 → HWPX」로 저장한 뒤 다시 불러와 주세요.");
	}
});

$("passages").value = loadText() || DEFAULT_TEXT;
refreshPoemSelect();
renderTimer();
// 화면을 처음 누르면 소리 막대를 깨운다
document.addEventListener("pointerdown", resumeMeter);
document.addEventListener("keydown", resumeMeter);
// 마이크를 새로 꽂으면 다시 연결한다
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
	navigator.mediaDevices.addEventListener("devicechange", () => {
		if (state.usesTrack && !(state.micTrack && state.micTrack.readyState === "live")) reconnectMic();
	});
}
// 인터넷이 다시 연결되면 기다리지 않고 바로 다시 듣는다
window.addEventListener("online", () => {
	if (state.playing && !state.paused && state.netDown) startRecognition();
});
window.addEventListener("offline", () => {
	if (state.playing) {
		state.netDown = true;
		setStatus("⚠️ 인터넷 연결이 끊겼어요 — 연결되면 자동으로 이어서 들어요. (「다음 연」 버튼은 계속 쓸 수 있어요)");
	}
});
// 링크를 열자마자 마이크 권한을 한 번 묻는다 (거절해도 게임 시작 때 다시 시도)
ensureMicTrack().then(track => {
	if (!state.playing && !track) $("notice").textContent = "🎤 마이크를 허용해 주세요 — 주소창 왼쪽 아이콘에서 바꿀 수 있어요";
});
</script>
</body>
</html>
